name: Test

on: [push, pull_request]

jobs:
  build_and_test:
    name: "CI: Build & Test"

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libtss2-dev

    - name: Set up stable Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Set up nightly Rust for formatting
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting using nightly
      run: cargo +nightly fmt --all -- --check

    - name: Run cargo clippy using stable
      run: cargo +stable clippy --workspace --features azure-attester -- -D warnings

    - name: Run cargo test
      run: cargo test --workspace --features azure-attester --all-targets

  azure_verifier_portability:
    name: "CI: Azure verifier portability (macOS)"

    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up stable Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check azure-verifier builds without the TPM stack
      run: cargo check -p attestation --no-default-features --features azure-verifier

    - name: Test azure-verifier
      run: cargo test -p attestation --no-default-features --features azure-verifier
